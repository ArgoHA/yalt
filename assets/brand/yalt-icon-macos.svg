<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">yalt app icon</title>
  <desc id="description">A purple Y-shaped annotation graph on a dark charcoal background.</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="18%" r="92%">
      <stop offset="0" stop-color="#242733"/>
      <stop offset="0.55" stop-color="#171923"/>
      <stop offset="1" stop-color="#101119"/>
    </radialGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="306" y1="304" x2="650" y2="730">
      <stop offset="0" stop-color="#a064ff"/>
      <stop offset="1" stop-color="#7139e8"/>
    </linearGradient>
    <radialGradient id="node" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#9d61ff"/>
      <stop offset="1" stop-color="#7137e6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f6efff"/>
      <stop offset="1" stop-color="#d7c8ff"/>
    </linearGradient>
    <filter id="edge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#070810" flood-opacity="0.42"/>
    </filter>
    <filter id="node-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#070810" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed and opaque so macOS does not add a light legacy-icon backing plate. -->
  <rect width="1024" height="1024" fill="url(#background)"/>

  <g filter="url(#edge-shadow)" fill="none" stroke="url(#edge)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M306 304 L512 470 L718 304"/>
    <path d="M512 470 L512 730"/>
  </g>

  <g filter="url(#node-shadow)">
    <g transform="translate(306 304)">
      <circle r="47" fill="url(#ring)"/>
      <circle r="33" fill="url(#node)"/>
    </g>
    <g transform="translate(718 304)">
      <circle r="47" fill="url(#ring)"/>
      <circle r="33" fill="url(#node)"/>
    </g>
    <g transform="translate(512 470)">
      <circle r="47" fill="url(#ring)"/>
      <circle r="33" fill="url(#node)"/>
    </g>
    <g transform="translate(512 730)">
      <circle r="47" fill="url(#ring)"/>
      <circle r="33" fill="url(#node)"/>
    </g>
  </g>
</svg>
